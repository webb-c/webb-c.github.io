# ---------------------------------------------------------------------------
# Site settings — Vaughn Sohn's homepage
# Restart `jekyll serve` after editing this file (it is not reloaded live).
# The old academicpages settings are kept in _old/_config.academicpages.yml.
# ---------------------------------------------------------------------------

title: "Vaughn Sohn"
description: "Research assistant at the QIT Lab, KAIST. Quantum algorithms and complexity theory."
url: "https://webb-c.github.io"
baseurl: ""
repository: "webb-c/webb-c.github.io"
lang: en
timezone: Asia/Seoul

# Your name, links and short bio live in _data/profile.yml.
# Puzzle boards (levels, gates, the welcome screen) live in _data/puzzles.yml.

# Turn every puzzle board on the site off (true / false).
puzzles: true

# --- Blog -------------------------------------------------------------------
permalink: /blog/:year/:month/:day/:title/
paginate: 5
paginate_path: /blog/page:num/

# Comments under blog posts (giscus, backed by GitHub Discussions).
# Fill these in from https://giscus.app to switch comments on; leave blank for none.
giscus:
  repo: ""          # e.g. webb-c/webb-c.github.io
  repo_id: ""
  category: ""
  category_id: ""

feed:
  path: feed.xml

# --- Content ----------------------------------------------------------------
collections:
  publications:        # one file per paper; listed on /publications/, no page of its own
    output: false
  talks:
    output: false

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post, nav: blog }
  - scope: { path: "", type: pages }
    values: { layout: page }

# --- Build ------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

include:
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
  - node_modules
  - local
  - _old

plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
